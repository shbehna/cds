[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "cds-framework"
version = "0.1.0"
description = "Contract Driven Services: build Databricks data products from ODCS data contracts."
readme = "README.md"
requires-python = ">=3.10"
keywords = ["databricks", "data contract", "odcs", "data engineering", "data quality", "dqx"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Database",
    "Typing :: Typed",
]
# PySpark is provided by the Databricks runtime (or Databricks Connect): it is not a
# dependency of the framework, whose unit tests run without it.
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Required by the quality service.
dqx = [
    "databricks-labs-dqx>=0.17",
    "databricks-sdk>=0.73",
]

[project.scripts]
cds = "cds.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/cds"]

[tool.hatch.build.targets.sdist]
include = ["src/cds", "notebooks", "README.md"]
