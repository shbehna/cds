name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.7"
          enable-cache: true

      - name: Install the workspace
        run: uv sync --all-packages --locked

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Type-check the framework and the demo
        run: uv run mypy

      - name: Test the framework and the demo
        run: uv run pytest

      - name: Validate the data products of the demo
        run: uv run cds validate cds-demo/products

      - name: Type-check and test the deployment program
        working-directory: cds-demo/deploy
        run: |
          uv sync --locked
          uv run mypy
          uv run pytest
