apiVersion: v3.2.0
kind: DataContract
id: donnees_qc.req.nom_entreprise
version: 1.0.0
name: Nom d'entreprise
description:
  purpose: Noms sous lesquels les entreprises font des affaires au Québec, avec leurs autres noms et leurs versions.
schema:
  - name: nom_entreprise
    physicalType: table
    businessName: Nom d'entreprise
    description: Noms, autres noms et versions des noms des entreprises (fichier source Nom.csv).
    properties:
      - name: numero_entreprise
        businessName: Numéro d'entreprise du Québec (NEQ)
        description: Numéro de l'entreprise qui utilise le nom. Colonne source NEQ.
        logicalType: string
        physicalType: STRING
        required: true
        primaryKey: true
        primaryKeyPosition: 1
        relationships:
          - to: entreprise.numero_entreprise
      - name: nom
        description: Nom légal de l'entreprise, ou autre nom qu'elle utilise au Québec. Colonne source NOM_ASSUJ.
        logicalType: string
        physicalType: STRING
        required: true
        primaryKey: true
        primaryKeyPosition: 2
      - name: nom_langue_etrangere
        description: >-
          Version du nom dans une autre langue que le français. Un même nom peut avoir plusieurs versions,
          inscrites le même jour : la colonne fait partie de la clé, et une valeur absente y compte comme une valeur.
          Colonne source NOM_ASSUJ_LANG_ETRNG.
        logicalType: string
        physicalType: STRING
        required: false
        primaryKey: true
        primaryKeyPosition: 5
      - name: code_statut_nom
        description: Code du statut du nom (domaine de valeur STAT_NOM). Colonne source STAT_NOM.
        logicalType: string
        physicalType: STRING
        required: true
        enum:
          - { value: "A", label: "Antérieur" }
          - { value: "F", label: "Futur" }
          - { value: "R", label: "Réservé" }
          - { value: "V", label: "En vigueur" }
      - name: code_type_nom
        description: Code du type de nom (domaine de valeur TYP_NOM). Colonne source TYP_NOM_ASSUJ.
        logicalType: string
        physicalType: STRING
        required: true
        primaryKey: true
        primaryKeyPosition: 3
        enum:
          - { value: "A", label: "Autre nom" }
          - { value: "M", label: "Dénomination sociale" }
          - { value: "N", label: "Nom" }
          - { value: "V", label: "Version du nom" }
      - name: date_inscription
        description: Date d'inscription du nom. Colonne source DAT_INIT_NOM_ASSUJ.
        logicalType: date
        physicalType: DATE
        required: true
        primaryKey: true
        primaryKeyPosition: 4
      - name: date_retrait
        description: Date du retrait du nom. Colonne source DAT_FIN_NOM_ASSUJ.
        logicalType: date
        physicalType: DATE
