# Partial data contract of the data product, merged under every contract of req, over the
# fields of its data product document (req.odps.yaml) and the partial data contract of the
# group (donnees_qc.odcs.yaml). It holds what ODPS does not describe: the service levels of
# the contracts. A contract defining slaProperties replaces the whole list.

# The service levels (cds.sla): the deployment schedules the job with the frequency, and
# alerts on the latency and the error rate (cds-demo/manifest); the scd service applies the
# retention to the history tables.
slaProperties:
  - property: frequency
    value: 15
    unit: d
    scheduler: cron
    schedule: "0 6 1,15 * *"
    description: >-
      Le registre est publié deux fois par mois : les tables sont chargées le 1er et le 15
      de chaque mois, à 6 h.
  - property: latency
    value: 18
    unit: d
    scheduler: cron
    schedule: "0 7 * * *"
    description: >-
      Le dernier chargement des tables date de moins de 18 jours : jusqu'à 17 jours
      séparent deux chargements, du 15 d'un mois de 31 jours au 1er du mois suivant.
      Vérifié chaque jour à 7 h.
  - property: errorRate
    value: 1
    unit: percent
    scheduler: cron
    # After the load of 6 am: the error rate only changes when the tables are loaded.
    schedule: "0 12 1,15 * *"
    description: >-
      Au plus 1 % des lignes de chaque table ont une erreur de qualité. Vérifié après
      chaque chargement, le 1er et le 15 de chaque mois à midi.
  - property: retention
    value: 10
    unit: y
    description: L'historique garde les versions remplacées pendant 10 ans.
