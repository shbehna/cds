[project]
name = "cds-demo-deploy"
version = "0.1.0"
description = "Pulumi program deploying the CDS demo to Databricks."
requires-python = "==3.12.*"
dependencies = [
    "pulumi>=3.200,<4",
    "pulumi-databricks>=1.118,<2",
]

[dependency-groups]
dev = [
    "mypy>=1.18",
    "pytest>=8.3",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib", "-ra"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["__main__.py", "pipeline.py", "tests"]
mypy_path = "tests"
explicit_package_bases = true

[[tool.mypy.overrides]]
# pulumi.runtime.test, which runs a test with the Pulumi mocks, is not annotated.
module = "test_pipeline"
disallow_untyped_decorators = false
