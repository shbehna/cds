# Variables of the nprod deployment. Check the values marked PLACEHOLDER before the
# first deployment. Secrets are never stored here: see README.md.
config:
  # Databricks workspace, and application (client) id of the deployment service principal.
  # Its OAuth secret is read from the DATABRICKS_CLIENT_SECRET environment variable.
  databricks:host: https://dbc-1e8aa6f9-7f19.cloud.databricks.com
  databricks:clientId: bf175dc4-c86b-4e88-83e9-9194c485a080
  # CDS environment id, which is also the Unity Catalog catalog of the data products.
  cds-demo:environment: nprod
  # PLACEHOLDER: folder of the REQ CSV files (Entreprise.csv, Nom.csv...) in the ext catalog.
  cds-demo:sourcePath: /Volumes/ext/donnees_qc/req
  # The job loads the synthetic data set (cds-demo/csv/testdata), which the deployment
  # uploads to sourcePath, instead of the files of the register.
  cds-demo:syntheticData: "true"
  # The nprod catalog is created by an administrator (README.md).
  cds-demo:createCatalog: "false"
  # Workspace folder receiving the notebooks, the data products and the framework wheel.
  cds-demo:workspaceRoot: /Shared/cds-demo/nprod
  # Serverless environment version of the job, and DQX version installed in it.
  cds-demo:environmentVersion: "5"
  cds-demo:dqxVersion: 0.17.0
  # Number of tables processed in parallel by each service.
  cds-demo:maxWorkers: "4"
  # PLACEHOLDER: SQL warehouse running the queries of the quality dashboard. The service
  # principal needs the CAN USE permission on it.
  cds-demo:warehouseName: Serverless Starter Warehouse
  # Masks the columns classified restricted (the addresses), except
  # for the service principal. The classification tag is a governed tag of the account,
  # shared by the environments: this stack creates it. The service principal needs MANAGE
  # on the nprod catalog to create the masking policy (README.md).
  cds-demo:masking: "true"
  cds-demo:createTagPolicies: "true"
  # The job tags the tables with their Discover domain: the subdomain Registraire des
  # entreprises du Québec of the domain Économie. The domains and their governed tags
  # belong to the account, shared by the environments: this stack creates them.
  cds-demo:createDomains: "true"
  # The job runs on the schedule of the frequency SLA of the contracts, in this time
  # zone. Paused in nprod: run it on demand. The alerts of the SLA are not paused: run the
  # error rate alert after a run, the error rate of the synthetic data set triggers it.
  cds-demo:timezone: America/Toronto
  cds-demo:pauseSchedule: "true"
  # The alerts are sent to the email support channels of the contracts, whose address is
  # fictitious, and to the addresses of the ALERT_EMAILS secret of GitHub (README.md).
